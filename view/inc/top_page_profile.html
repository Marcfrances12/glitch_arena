        .live-pulse {
            position: relative;
        }
        .live-pulse::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: 2px solid #256af4;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
